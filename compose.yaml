services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Copy .env.example to .env and choose a password}
    volumes: [sqlserver-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: src/Carrier.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      Database__Initialize: "true"
      ConnectionStrings__Carriers: Server=sqlserver;Database=Carriers;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      AllowedHosts: localhost;127.0.0.1;api
    depends_on:
      sqlserver: { condition: service_healthy }
  web:
    build: ./web
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
volumes:
  sqlserver-data:
