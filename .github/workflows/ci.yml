name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet run --project tests/Carrier.CoreChecks -c Release --no-build
      - run: dotnet test --no-build -c Release --filter 'Category!=SqlServer' --logger trx
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-failure-diagnostics
          path: '**/TestResults/*.trx'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: pnpm/action-setup@v4
        with: { version: '10.20.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pnpm install --no-frozen-lockfile
        working-directory: web
      - run: pnpm build && pnpm test
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-failure-diagnostics
          path: |
            web/test-results
            **/TestResults/*.trx
  sqlserver:
    runs-on: ubuntu-latest
    services:
      database:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Local_CI_Only_7x!Change'
        ports: ['1433:1433']
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local_CI_Only_7x!Change' -C -Q 'SELECT 1' -b"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      CARRIER_TEST_SQLSERVER: 'Server=localhost,1433;Database=CarrierIntegrationTests;User Id=sa;Password=Local_CI_Only_7x!Change;TrustServerCertificate=True;Encrypt=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test tests/Carrier.Tests --filter 'Category=SqlServer' -c Release
